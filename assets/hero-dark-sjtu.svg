<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Wang Daoshuai — Distributed Data Systems</title>
  <desc id="desc">Shanghai Jiao Tong University alumnus. Data. Compute. Infrastructure. Daft, Apache Spark, Ray, Kubernetes, and AI Infrastructure. An animated network of connected compute nodes.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1d3447" stroke-width=".6" opacity=".48"/></pattern>
    <radialGradient id="halo"><stop stop-color="#154d61" stop-opacity=".6"/><stop offset="1" stop-color="#080e1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge"><stop stop-color="#6ce9d5"/><stop offset="1" stop-color="#5897ed"/></linearGradient>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="498" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .orbit { transform-origin: 931px 253px; animation: orbit 50s linear infinite; }
      .signal { animation: signal 4s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes signal { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .orbit, .signal { animation: none; } .packet { display: none; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="500" fill="#080e1a"/>
    <rect x="682" width="518" height="500" fill="url(#grid)"/>
    <ellipse cx="935" cy="250" rx="330" ry="280" fill="url(#halo)"/>
    <path d="M60 76 H106" stroke="#6ce9d5" stroke-width="3"/>
    <text class="mono" x="120" y="81" fill="#6ce9d5" font-size="14" letter-spacing="2.2">WD / ENGINEERING</text>
    <text class="mono" x="1138" y="81" fill="#8da6bf" text-anchor="end" font-size="12" letter-spacing="1.7">DISTRIBUTED SYSTEMS</text>
    <text class="sans" x="55" y="193" fill="#edf6ff" font-weight="750" font-size="82" letter-spacing="-3">WANG</text>
    <text class="sans" x="55" y="278" fill="#edf6ff" font-weight="750" font-size="82" letter-spacing="-3">DAOSHUAI<tspan fill="#6ce9d5">.</tspan></text>
    <text class="sans" x="60" y="325" fill="#6ce9d5" font-size="27" font-weight="650">Shanghai Jiao Tong University</text>
    <text class="sans" x="60" y="359" fill="#b5c9dd" font-size="21" letter-spacing=".2">Data. Compute. Infrastructure.</text>
    <text class="mono" x="60" y="392" fill="#8da6bf" font-size="14">Daft / Spark / Ray / Kubernetes / AI Infra</text>
    <path d="M60 421 H1140" stroke="#213b51"/>
    <circle cx="66" cy="456" r="4" fill="#6ce9d5"/>
    <text class="mono" x="82" y="461" fill="#b5c9dd" font-size="12.5" letter-spacing="1.2">@DogerW666</text>
    <text class="mono" x="1140" y="461" fill="#8da6bf" text-anchor="end" font-size="12.5">ALWAYS MAINTAIN ENTHUSIASM</text>

    <g fill="none" stroke="#213b51">
      <circle cx="931" cy="253" r="145" stroke-dasharray="3 8"/>
      <circle class="orbit" cx="931" cy="253" r="171" stroke-dasharray="100 974" stroke="#6ce9d5" stroke-opacity=".35"/>
      <path d="M789 166 H931 V253 M1073 166 H931 M789 340 H931 V253 M1073 340 H931" stroke-width="1.5"/>
      <path d="M789 166 V340 M1073 166 V340" stroke-dasharray="3 5"/>
    </g>
    <g fill="#6ce9d5">
      <circle class="packet" r="3"><animateMotion dur="4s" repeatCount="indefinite" path="M789 166 H931 V253"/></circle>
      <circle class="packet" r="3"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M1073 340 H931 V253"/></circle>
      <circle class="packet" r="3"><animateMotion dur="5s" begin="-1s" repeatCount="indefinite" path="M931 253 V166 H1073"/></circle>
      <circle class="packet" r="3"><animateMotion dur="5s" begin="-3s" repeatCount="indefinite" path="M931 253 V340 H789"/></circle>
    </g>
    <rect x="896" y="218" width="70" height="70" rx="16" fill="#0f1b2d" stroke="url(#edge)" stroke-width="1.5"/>
    <text class="mono" x="931" y="248" fill="#6ce9d5" text-anchor="middle" font-size="22" font-weight="700">AI</text>
    <text class="mono" x="931" y="270" fill="#6ce9d5" text-anchor="middle" font-size="12" letter-spacing="1.5">INFRA</text>
    <g class="mono" font-size="16" font-weight="600" text-anchor="middle">
      <rect x="724" y="141" width="130" height="50" rx="10" fill="#0f1b2d" stroke="#213b51"/>
      <text x="789" y="172" fill="#edf6ff">Daft</text>
      <rect x="1008" y="141" width="130" height="50" rx="10" fill="#0f1b2d" stroke="#213b51"/>
      <text x="1073" y="172" fill="#edf6ff">Spark</text>
      <rect x="724" y="315" width="130" height="50" rx="10" fill="#0f1b2d" stroke="#213b51"/>
      <text x="789" y="346" fill="#edf6ff">Ray</text>
      <rect x="1008" y="315" width="130" height="50" rx="10" fill="#0f1b2d" stroke="#213b51"/>
      <text x="1073" y="346" fill="#edf6ff">K8s</text>
    </g>
    <g class="signal" fill="#6ce9d5"><circle cx="739" cy="156" r="2.5"/><circle cx="1023" cy="156" r="2.5"/><circle cx="739" cy="330" r="2.5"/><circle cx="1023" cy="330" r="2.5"/></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="499" rx="20" fill="none" stroke="#213b51"/>
</svg>
